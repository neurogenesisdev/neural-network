# Code projects tracked by the vault (master-vault design v4 §6).
# slug -> remote -> per-host checkout -> card. Repos own STATUS.md; cards own purpose and links.
# A missing checkout shows as "unavailable" in _generated/projects-status.md; nothing is backfilled.
# Facts checked on the laptop on 2026-10-21. Server checkouts were not checked from the laptop:
# each server path is the intended location under /home/dev/code/ and is marked unverified.
# No project card exists yet for any entry; the card path is where it will go.
version: 1
projects:
